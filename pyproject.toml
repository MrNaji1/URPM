[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "urpm"
dynamic = ["version"]
description = "A cute GTK app that shows every package installed on your Linux machine"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "MrNaji1" }]
requires-python = ">=3.10"
# PyGObject + GTK 4 come from your distro (see README), so they're not listed here:
# install with `pipx install --system-site-packages ...` so URPM can see them.
dependencies = []
keywords = ["linux", "packages", "apt", "flatpak", "snap", "appimage", "gtk"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: X11 Applications :: GTK",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Software Distribution",
    "Natural Language :: English",
    "Natural Language :: Arabic",
    "Natural Language :: French",
    "Natural Language :: German",
    "Natural Language :: Portuguese (Brazilian)",
    "Natural Language :: Spanish",
]

[project.urls]
Homepage = "https://github.com/MrNaji1/URPM"
Issues = "https://github.com/MrNaji1/URPM/issues"
Changelog = "https://github.com/MrNaji1/URPM/releases"

[project.scripts]
urpm = "urpm.cli:run"

[tool.setuptools.dynamic]
version = { attr = "urpm.__version__" }

[tool.setuptools.packages.find]
include = ["urpm*"]

[tool.setuptools.package-data]
urpm = ["data/*", "data/icons/*", "locale/*.po"]
"urpm.ui" = ["*.css"]

[tool.coverage.run]
source = ["urpm"]
omit = ["urpm/__main__.py"]  # two lines that just call run()

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["E501"]  # long lines are fine when breaking them hurts readability
