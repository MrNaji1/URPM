name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  parsers:
    name: Parser tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v

  ui:
    name: UI tests (real GTK 4 under Xvfb)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y python3-gi gir1.2-gtk-4.0 xvfb dbus-x11
      - run: URPM_UI_TESTS=1 xvfb-run -a dbus-run-session -- /usr/bin/python3 -m unittest discover -s tests -v

  package:
    name: Build .deb and check install script
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash -n install.sh
      - run: make deb
      - run: dpkg-deb -I dist/*.deb && dpkg-deb -c dist/*.deb
      - uses: actions/upload-artifact@v4
        with:
          name: urpm-deb
          path: dist/*.deb
