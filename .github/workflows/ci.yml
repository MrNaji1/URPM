name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check urpm tests

  parsers:
    name: Package-manager tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v

  ui:
    name: All tests with real GTK 4 (Xvfb) + coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y python3-gi gir1.2-gtk-4.0 python3-coverage xvfb dbus-x11
      - name: Run every test, including the UI ones
        run: URPM_UI_TESTS=1 xvfb-run -a dbus-run-session -- /usr/bin/python3 -m coverage run -m unittest discover -s tests -v
      - name: Coverage report (fails below 90%)
        run: |
          /usr/bin/python3 -m coverage report --fail-under=90 | tee coverage.txt
          { echo '### Test coverage'; echo '```'; cat coverage.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  package:
    name: Build .deb and check install script
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash -n install.sh
      - run: make deb
      - run: dpkg-deb -I dist/*.deb && dpkg-deb -c dist/*.deb
      - name: Ubuntu PPA source package builds
        run: |
          cp -r packaging/debian/debian debian
          dpkg-buildpackage -b -us -uc
          dpkg-source -b .
          rm -rf debian
      - name: PyPI package builds and passes twine's checks
        run: pipx run build && pipx run twine check dist/*.whl dist/urpm-*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: urpm-deb
          path: dist/*.deb
