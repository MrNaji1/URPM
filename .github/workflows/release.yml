name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tests
      - run: make deb
      - name: Source tarball and checksums (install.sh verifies these)
        run: |
          version="${GITHUB_REF_NAME#v}"
          git archive --format=tar.gz --prefix="urpm-$version/" -o "dist/urpm-$version.tar.gz" HEAD
          cd dist && sha256sum -- *.deb *.tar.gz > SHA256SUMS && cat SHA256SUMS
      - name: Publish GitHub release with the .deb attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/*.deb dist/*.tar.gz dist/SHA256SUMS --clobber
          else
            gh release create "$tag" dist/*.deb dist/*.tar.gz dist/SHA256SUMS --title "URPM ${tag#v}" --generate-notes
          fi
